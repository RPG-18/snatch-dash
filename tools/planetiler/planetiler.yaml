# Тонкая настройка planetiler — переопределение флагов сборки для страны или
# отдельного субъекта. Файл не обязателен: без него build_pmtiles.py соберёт
# всё с дефолтами из секции `defaults`.
#
# Что сюда кладём, а что нет:
#   - да: «настроечные» флаги, которые разумно менять на регион —
#     simplify_tolerance (скаляр), exclude_layers (список), languages, maxzoom…;
#   - нет: структурные флаги (--osm-path, --output), --download (не зависит от
#     региона) и --threads (машино-зависимая настройка, задаётся окружением
#     PLANETILER_THREADS) — всё это знает только сам скрипт build_pmtiles.py.
#
# Приоритет на уровне отдельного флага: subjects > countries > defaults.
# Субъект, задавший только simplify_tolerance, унаследует exclude_layers из
# страны/defaults, а не потеряет его. Переопределение заменяет значение целиком
# (списки не сливаются: exclude_layers: [landcover] у субъекта не добавит слой
# к списку страны, а заменит его).

defaults:
  # Глобальные значения по умолчанию — применяются ко всем странам/субъектам,
  # если те не переопределили этот флаг ниже.
  languages: ru,en          # приложение двуязычное (RU/EN, см. lib/l10n/), иначе тянет name:* на всех языках
  maxzoom: 14               # потолок детализации схемы OpenMapTiles
  simplify_tolerance: 0.1   # дефолт planetiler (в пикселях); завышается на крупных малонаселённых субъектах
  # exclude_layers: [landcover]  # по умолчанию слой не отключается — раскомментировать, чтобы отключить глобально

# Переопределение для всей страны. Ключ = iso из regions.yaml (ru, by, …).
# Пример:
#   ru:
#     simplify_tolerance: 1.5
countries: {}

# Переопределение для отдельного субъекта. Ключ = код региона (ru-sa, ru-chu, …);
# для стран mode: whole ключ — просто iso (by). Приоритет выше, чем у countries.
#
# Ниже заполнены все 16 субъектов, у которых сборка от 2026-08-30 дала .pmtiles
# крупнее 70 МиБ — это было 2.20 ГиБ из 3.76 ГиБ всего корпуса. Что отключать,
# выбрано не на глаз: доли байтов по слоям посчитаны прямо из собранных .pmtiles
# (разбор PMTiles v3 + MVT), они и приведены в комментариях к каждому субъекту.
#
# Цифры «было -> стало» — фактические, по пересборке от 2026-08-31 (не прогноз):
# по этим 16 субъектам 2.20 -> 1.14 ГиБ (-48%), по всему корпусу 3.76 -> 2.71 ГиБ
# (-28%, см. [`minimization_ru.md`](./minimization_ru.md)). Остальные 67 субъектов собраны с дефолтами и
# совпали с прежними размерами до 0.1 МиБ.
#
# Почему именно эти флаги:
#   exclude_layers — единственный крупный рычаг. `landcover` (лес/луг/болото,
#     фоновая заливка) почти везде слой №1: 26-60% байтов файла. На экране дэша
#     526x300 это фон, а не навигационная информация.
#   `water`/`waterway` не отключаются нигде, хотя в Якутии это 66% веса, а на
#     Чукотке 95%: озёра и реки — ориентиры, без них карта врёт.
#   `housenumber` — номера домов; на дэше нечитаемы, в плотных субъектах до 6%.
#   `water_name`/`mountain_peak` — подписи озёр и вершин: в тайге и на Алтае их
#     тысячи (13% у ru-al), на дэше пользы нет.
#   simplify_tolerance: 0.5 — работает ТОЛЬКО ниже maxzoom (в planetiler
#     tolerance(z) = z >= maxzoom ? simplify_tolerance_at_max_zoom : simplify_tolerance),
#     а z9-z13 — это 45-55% байтов. Замер Дугласом-Пекером по реальной геометрии
#     (water/waterway/transportation/boundary): при 0.5 на z12 остаётся 45-57%
#     вершин, на z13 — 54-85%. Полпикселя на обзорных зумах глазом не видно.
#     На landcover/landuse/building этот флаг НЕ влияет — они зовут
#     setPixelTolerance сами (org/openmaptiles/layers/*), но их мы и так режем.
#   simplify_tolerance_at_max_zoom: 0.5 — только там, где вода даёт больше
#     трети веса. Дефолт 0.0625 px planetiler держит «под оверзум»; при оверзуме
#     с z14 до z17 полпикселя превращаются в 0.06 px, то есть незаметны.
#     По факту пересборки оба флага упрощения вместе дали сверх отключения слоёв
#     ещё 2-22% (медиана 8%): больше всего на Ленинградской области (22%) и
#     Хабаровском крае (18%), меньше всего на Кировской (2%), где почти весь вес
#     и так уносил landcover. То есть упрощение — добивка, рычаг всё равно
#     exclude_layers.
#
# Чего здесь намеренно нет:
#   - `building`/`poi` не отключены нигде: заправки и силуэты кварталов — это
#     ориентиры в городе. `building` (12.7% в ru-kda) — первый кандидат, если
#     после пересборки Краснодар окажется всё ещё великоват.
#   - maxzoom не понижается, хотя z14 — это 42-63% байтов: ниже 14 геометрия
#     дорог для пошаговой навигации становится слишком грубой.
#   - min_feature_size_at_max_zoom не трогается: замер показал, что 99.7% байтов
#     воды на z14 — объекты крупнее 2 px, срезать по размеру там просто нечего.
subjects:
  # --- Тайга/тундра: почти нет застройки, вес делают landcover, вода и реки ---

  # Якутия: 437.4 -> 327.1 МиБ (-25%). Доли до чистки: water 46%, waterway 21%, landcover 11%.
  ru-sa:
    exclude_layers: [landcover, water_name, housenumber]
    simplify_tolerance: 0.5
    simplify_tolerance_at_max_zoom: 0.5

  # Чукотка: 254.8 -> 24.0 МиБ на обе половины (-91%) — 12.4 запад + 11.6 восток.
  # Основную часть тут дала не чистка слоёв, а фикс антимеридиана (коммит 9f14fc2):
  # в старом файле 95% веса были океанскими тайлами через все 360° долготы. Слои
  # оставлены отключёнными по той же логике, что и у соседей по группе.
  ru-chu:
    exclude_layers: [landcover, water_name, housenumber]
    simplify_tolerance: 0.5
    simplify_tolerance_at_max_zoom: 0.5

  # Чукотка, восточная половина (lon -180..-156), собрана впервые: 11.6 МиБ.
  ru-chu-east:
    exclude_layers: [landcover, water_name, housenumber]
    simplify_tolerance: 0.5
    simplify_tolerance_at_max_zoom: 0.5

  # Карелия: 121.7 -> 50.1 МиБ (-59%). Доли до чистки: landcover 43%, water 26%, water_name 9%.
  ru-kr:
    exclude_layers: [landcover, water_name, housenumber]
    simplify_tolerance: 0.5
    simplify_tolerance_at_max_zoom: 0.5

  # Коми: 111.7 -> 58.0 МиБ (-48%). Доли до чистки: landcover 43%, waterway 23%.
  ru-ko:
    exclude_layers: [landcover, water_name, housenumber]
    simplify_tolerance: 0.5
    simplify_tolerance_at_max_zoom: 0.5

  # Кировская область: 106.7 -> 40.6 МиБ (-62%). Доли до чистки: landcover 60% — рекорд по корпусу.
  ru-kir:
    exclude_layers: [landcover, water_name, housenumber]
    simplify_tolerance: 0.5

  # Республика Алтай: 82.8 -> 32.0 МиБ (-61%). Доли до чистки: landcover 44%, waterway 19%, mountain_peak 13%.
  ru-al:
    exclude_layers: [landcover, water_name, mountain_peak, housenumber]
    simplify_tolerance: 0.5

  # Иркутская область: 82.7 -> 54.5 МиБ (-34%). Доли до чистки: landcover 26%, waterway 19%, water 14%.
  ru-irk:
    exclude_layers: [landcover, water_name, housenumber]
    simplify_tolerance: 0.5
    simplify_tolerance_at_max_zoom: 0.5

  # Хабаровский край: 74.0 -> 40.8 МиБ (-45%). Доли до чистки: landcover 30%, water 27%.
  ru-kha:
    exclude_layers: [landcover, water_name, housenumber]
    simplify_tolerance: 0.5
    simplify_tolerance_at_max_zoom: 0.5

  # --- Населённые: landcover тоже слой №1, но города оставляем как есть ---

  # Ленинградская область: 212.6 -> 110.0 МиБ (-48%). Доли до чистки: water 37%, landcover 34%.
  ru-len:
    exclude_layers: [landcover, housenumber]
    simplify_tolerance: 0.5
    simplify_tolerance_at_max_zoom: 0.5

  # Башкортостан: 151.5 -> 84.7 МиБ (-44%). Доли до чистки: landcover 38%.
  ru-ba:
    exclude_layers: [landcover, housenumber]
    simplify_tolerance: 0.5

  # Алтайский край: 142.2 -> 70.8 МиБ (-50%). Доли до чистки: landcover 41%.
  ru-alt:
    exclude_layers: [landcover, housenumber]
    simplify_tolerance: 0.5

  # Краснодарский край: 114.1 -> 70.8 МиБ (-38%). Доли до чистки: landcover 27%, building 13%, housenumber 6%.
  ru-kda:
    exclude_layers: [landcover, housenumber]
    simplify_tolerance: 0.5

  # Татарстан: 112.9 -> 68.2 МиБ (-40%). Доли до чистки: landcover 33%.
  ru-ta:
    exclude_layers: [landcover, housenumber]
    simplify_tolerance: 0.5

  # Ростовская область: 90.3 -> 54.8 МиБ (-39%). Доли до чистки: landcover 32%.
  ru-ros:
    exclude_layers: [landcover, housenumber]
    simplify_tolerance: 0.5

  # Новосибирская область: 82.9 -> 42.2 МиБ (-49%). Доли до чистки: landcover 40%.
  ru-nvs:
    exclude_layers: [landcover, housenumber]
    simplify_tolerance: 0.5

  # Воронежская область: 71.3 -> 41.3 МиБ (-42%). Доли до чистки: landcover 38%.
  ru-vor:
    exclude_layers: [landcover, housenumber]
    simplify_tolerance: 0.5
