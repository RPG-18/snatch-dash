# Чего здесь намеренно нет:
#   - `water`/`waterway` не отключаются нигде, хотя на честной сборке в Якутии
#     это 74% веса, а на Чукотке 82%: озёра и реки — ориентиры, без них карта
#     врёт. Именно поэтому водным субъектам достаётся упрощение, а не чистка.
#   - `building`/`poi` не отключены нигде: заправки и силуэты кварталов — это
#     ориентиры в городе. `building` (6.1% корпуса, 24% в ru-kda) — первый
#     кандидат, если корпус придётся ужимать дальше, но это осознанная потеря
#     городской ориентации, а не бесплатная экономия. Решение за UX.
#   - maxzoom не понижается, хотя z14 — это 40-79% байтов пака (медиана 53%):
#     ниже 14 геометрия дорог для пошаговой навигации становится слишком грубой.
#   - min_feature_size_at_max_zoom не трогается: замер показал, что 99.7% байтов
#     воды на z14 — объекты крупнее 2 px, срезать по размеру там просто нечего.
#
# История: до 2026-09-01 здесь стояли per-subject exclude_layers у 16 субъектов
# и цифры «было -> стало» со сборок 2026-08-30/31. Те сборки собирались из
# урезанных полигонов, их размеры занижены на порядок, а тогдашний «-28%» был
# артефактом бага — поэтому цифры убраны, а не перенесены. Разбор — в
# [`minimization_ru.md`](./minimization_ru.md), сами числа — в git history.
