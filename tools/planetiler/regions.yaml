# Конфигурация конвейера OSM extract -> PMTiles.
#
# Один элемент `countries` — одна страна. Скрипты конвейера (fetch/extract/build,
# см. README.md) обязаны пропускать любую страну с `enabled: false` — она в конфиге
# только как заготовка/место для будущих полей, реальный osmium/planetiler
# по ней не запускается и данные не скачиваются.
#
# mode:
#   whole    — вся страна одним файлом, выход `<iso>.pmtiles`.
#   subjects — резать на субъекты/регионы; код каждого субъекта берётся из тега
#              ISO3166-2 на релации границы с admin_level = subject_admin_level,
#              приведённого к нижнему регистру (RU-MOW -> ru-mow). Список субъектов
#              не хардкодится здесь — получается на этапе fetch_boundaries (см. README.md).
#
# merge — склейка нескольких субъектов в один пак (только для mode: subjects).
#         Границы частей объединяются, буфер кладётся уже вокруг объединения, на
#         выходе один файл `<code>.pmtiles` вместо нескольких. Границы самих
#         частей при этом качаются и лежат в polygons/ как обычно — склейка
#         происходит на шаге нарезки, а не на шаге границ.
#         Повтор кода группы, часть в двух группах сразу, часть без границы —
#         ошибка конфига, скрипт падает (см. common.pack_plan).
#
# exclude — субъекты, для которых пак не собирается вовсе. Граница всё равно
#         качается и лежит в polygons/ — по ней проверяется, что код в exclude не
#         опечатка (иначе субъект молча остался бы в корпусе). Код без границы —
#         ошибка конфига, скрипт падает.
#
# source — прямая ссылка на .osm.pbf с Geofabrik. Не проверялись живым запросом
# на момент написания конфига — свериться со списком https://download.geofabrik.de/
# перед первым использованием, у Geofabrik страницы иногда переезжают.

countries:
  - iso: ru
    name: Россия
    enabled: true
    mode: subjects
    subject_admin_level: 4
    source: https://download.geofabrik.de/russia-latest.osm.pbf
    merge:
      # Город федерального значения и окружающая его область — одна агломерация
      # и одна поездка. Раздельные паки заставляли качать оба и попадать в
      # ситуацию «выехал за КАД — карта кончилась».
      - code: ru-len-spe
        parts: [ru-len, ru-spe]
        note: >
          Санкт-Петербург целиком лежит в дыре Ленинградской области, поэтому
          объединение — это ровно внешняя граница области: bbox не меняется
          (26.44-35.70 в. д., 58.42-61.33 с. ш.), дыра закрывается.
      - code: ru-mos-mow
        parts: [ru-mos, ru-mow]
        note: >
          Москва (с Новомосковским и Троицким округами) не анклав — она вырезана
          из области до её внешнего края у Калужской, поэтому объединение шире
          области по площади, но не по bbox: 35.15-40.21 в. д., 54.26-56.96 с. ш.
    # Чукотка — единственный субъект, пересекающий 180-й меридиан, и единственный,
    # который нельзя отдать одним файлом: TileJSON запрещает bbox через
    # антимеридиан, у цельного пака он вырождается во весь мир. Двумя файлами она
    # ломает правило «один субъект = один пак» во всём клиенте ради 127 МБ на
    # 48 тысяч жителей и единственную дорогу. Убрана целиком; вернуть — убрать
    # отсюда, машинерия для двух половин в cut_packs.split_at_antimeridian цела.
    exclude: [ru-chu]

  - iso: ab
    name: Абхазия
    enabled: false
    mode: whole
    source: null
    note: >
      Частично признанное государство, без собственного кода ISO 3166-1 (код
      "ab" здесь условный, де-факто, не ISO-стандарт) и без отдельного
      Geofabrik-экстракта — территория входит в грузинский. Нужно отдельно
      решить, откуда брать границу и данные, прежде чем включать.

  - iso: az
    name: Азербайджан
    enabled: false
    mode: whole
    source: https://download.geofabrik.de/asia/azerbaijan-latest.osm.pbf

  - iso: am
    name: Армения
    enabled: false
    mode: whole
    source: https://download.geofabrik.de/asia/armenia-latest.osm.pbf

  - iso: by
    name: Беларусь
    enabled: false
    mode: whole
    source: https://download.geofabrik.de/europe/belarus-latest.osm.pbf

  - iso: ge
    name: Грузия
    enabled: false
    mode: whole
    source: https://download.geofabrik.de/asia/georgia-latest.osm.pbf

  - iso: kz
    name: Казахстан
    enabled: false
    mode: whole
    source: https://download.geofabrik.de/asia/kazakhstan-latest.osm.pbf

  - iso: kg
    name: Кыргызстан
    enabled: false
    mode: whole
    source: https://download.geofabrik.de/asia/kyrgyzstan-latest.osm.pbf

  - iso: md
    name: Молдова
    enabled: false
    mode: whole
    source: https://download.geofabrik.de/europe/moldova-latest.osm.pbf

  - iso: tj
    name: Таджикистан
    enabled: false
    mode: whole
    source: https://download.geofabrik.de/asia/tajikistan-latest.osm.pbf

  - iso: uz
    name: Узбекистан
    enabled: false
    mode: whole
    source: https://download.geofabrik.de/asia/uzbekistan-latest.osm.pbf

  - iso: ua
    name: Украина
    enabled: false
    mode: whole
    source: https://download.geofabrik.de/europe/ukraine-latest.osm.pbf
    note: >
      В OSM для части территории (Крым, зоны конфликта) существуют
      альтернативные релации границы. Какую использовать — решить отдельно
      до включения обработки, конвейер здесь этот выбор не делает.
