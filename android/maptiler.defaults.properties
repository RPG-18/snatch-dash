# Template for android/maptiler.local.properties (gitignored). Copy the
# value below there — read by packages/opendash_dash_engine's Gradle build
# (see its android/build.gradle.kts) and exposed to native Kotlin as
# BuildConfig.MAPTILER_API_KEY. Unlike YANDEX_API_KEY (Dart-side, via
# --dart-define-from-file) this one is native-only: it backs TileProvider.kt,
# the off-screen dash-stream renderer's raster tile source — deliberately a
# separate source from the in-app Yandex MapKit map.
#
# Generate at https://cloud.maptiler.com/account/keys/ (free tier covers this
# comfortably). Bring-your-own-key — without it the dash-stream map tiles
# fail to fetch and the dash falls back to a blank/dark map background.
MAPTILER_API_KEY=YOUR_MAPTILER_API_KEY
