# Тонкая настройка planetiler — переопределение флагов сборки для страны или
# отдельного субъекта. Файл не обязателен: без него build_pmtiles.py соберёт
# всё с дефолтами из секции `defaults`.
#
# Что сюда кладём, а что нет:
#   - да: «настроечные» флаги, которые разумно менять на регион —
#     simplify_tolerance (скаляр), exclude_layers (список), languages, maxzoom…;
#   - нет: структурные флаги (--osm-path, --output), --download (не зависит от
#     региона) и --threads (машино-зависимая настройка, задаётся окружением
#     PLANETILER_THREADS) — всё это знает только сам скрипт build_pmtiles.py.
#
# Приоритет на уровне отдельного флага: countries > defaults. Переопределение
# заменяет значение целиком (списки не сливаются: exclude_layers: [landcover] у
# страны не добавит слой к списку defaults, а заменит его).
#
# Уровня субъекта здесь БОЛЬШЕ НЕТ. С 2026-09-02 planetiler запускается один раз
# на страну, а паки субъектов вырезаются из этой сборки (cut_packs.py), поэтому
# разные флаги у соседних субъектов физически невыразимы — см. build_pmtiles.py.

defaults:
  # Глобальные значения по умолчанию — применяются ко всем странам/субъектам,
  # если те не переопределили этот флаг ниже.
  languages: ru,en          # приложение двуязычное (RU/EN, см. lib/l10n/), иначе тянет name:* на всех языках
  maxzoom: 14               # потолок детализации схемы OpenMapTiles

  # Пирамида начинается с z11, а не с 0: ниже при активной навигации не нужно.
  # Значение подобрано под лестницу зумов дэша — z11-20 (`zoomIn()`/`zoomOut()`
  # в DashEngineController), то есть пак покрывает её ровно от нижней ступени.
  #
  # Замеры 2026-09-02 (вырезы из готовой сборки страны, все 84 пака):
  #   z0-14  — 4.95 ГБ
  #   z11-14 — 4.62 ГБ (-6.7%)   <- сейчас
  #   z13-14 — 3.75 ГБ (-24.3%), но это дешевле z11 всего на 0.87 ГБ, а стоит
  #            двух нижних ступеней лестницы, то есть пустого экрана на них.
  #
  # ВАЖНО: ниже minzoom рендер не достраивает — где тайла нет, там пусто, а не
  # грубая карта. Всё, что показывает маршрут целиком (экран превью маршрутов),
  # на z11 всё равно не помещается: на 526x300 это ~40x23 км. Такой обзор
  # придётся держать на онлайн-тайлах — см. docs/offline_mode_ru.md, §8.
  minzoom: 11
  simplify_tolerance: 0.1   # дефолт planetiler (в пикселях); поднимается до 0.5 на водных субъектах ниже

  # Слои отключаются ГЛОБАЛЬНО, а не по субъектам (по замерам честной сборки
  # 2026-09-01, см. git history). Раньше этот список стоял
  # у 16 крупнейших субъектов; на честных данных выяснилось, что для остальных
  # 67 он такой же уместный, а не «мелочь, которой можно пренебречь»:
  #   landcover — 20.5% байтов корпуса, слой №1. На экране дэша 526x300 это фон,
  #     а не навигация: заливку фона даёт сам рендер.
  #   housenumber — 1.7%. Номера домов на дэше нечитаемы при любом зуме.
  #   water_name / mountain_peak — 3.8% вместе. Подписи озёр и вершин на дэше
  #     бесполезны, а весят до 16.5% пака (ru-kc), 13.5% (ru-mur), 11% (ru-kk):
  #     это не только тайга, но и Кавказ с Саянами, поэтому список глобальный.
  # Вместе 22.2% несжатых байт. Пересборка 2026-09-01 (вечер) с этим списком и
  # упрощением ниже дала -28.7%: 6.08 -> 4.34 ГиБ, 84/84 паков прошли проверку.
  #
  # ВАЖНО: списки не сливаются. Если субъекту понадобится свой exclude_layers,
  # его придётся выписать целиком, вместе с этими четырьмя слоями.
  exclude_layers: [landcover, housenumber, water_name, mountain_peak]

# Переопределение для всей страны. Ключ = iso из regions.yaml (ru, by, …).
# Пример:
#   ru:
#     simplify_tolerance: 1.5
countries: {}

# Переопределение для отдельного субъекта. Ключ = код региона (ru-sa, ru-chu, …);
# для стран mode: whole ключ — просто iso (by). Приоритет выше, чем у countries.
#
# Слоёв здесь больше нет — они отключены глобально выше. Осталось упрощение
# геометрии: единственный рычаг для субъектов, где вес делает вода, а её
# отключать нельзя.
#
#   simplify_tolerance: 0.5 — работает ТОЛЬКО ниже maxzoom (в planetiler
#     tolerance(z) = z >= maxzoom ? simplify_tolerance_at_max_zoom : simplify_tolerance),
#     а z9-z13 — это 46% байтов корпуса. Замер Дугласом-Пекером по реальной
#     геометрии: при 0.5 на z12 остаётся 45-57% вершин, на z13 — 54-85%.
#     Полпикселя на обзорных зумах глазом не видно. Флаг действует на все слои,
#     кроме landcover/landuse/building — только эти три зовут setPixelTolerance
#     сами (проверено по org/openmaptiles/layers/* в planetiler.jar), но их мы и
#     так режем.
#   simplify_tolerance_at_max_zoom: 0.5 — дефолт 0.0625 px planetiler держит
#     «под оверзум»; при оверзуме с z14 до z17 полпикселя превращаются в 0.06 px,
#     то есть незаметны.
#
# Порог отбора — water + waterway > 40% веса пака ПОСЛЕ глобального
# exclude_layers (на исходном составе доли несопоставимы: у уже настроенных
# субъектов landcover был вырезан, у остальных нет). Проценты в комментариях —
# именно эта доля, размер — файла сборки 2026-09-01 до чистки слоёв.

# Чего здесь намеренно нет:
#   - `water`/`waterway` не отключаются нигде, хотя на честной сборке в Якутии
#     это 74% веса, а на Чукотке 82%: озёра и реки — ориентиры, без них карта
#     врёт.
#   - `building`/`poi` не отключены нигде: заправки и силуэты кварталов — это
#     ориентиры в городе. `building` (6.1% корпуса, 24% в ru-kda) — первый
#     кандидат, если корпус придётся ужимать дальше, но это осознанная потеря
#     городской ориентации, а не бесплатная экономия. Решение за UX.
#   - maxzoom не понижается, хотя z14 — это 40-79% байтов пака (медиана 53%):
#     ниже 14 геометрия дорог для пошаговой навигации становится слишком грубой.
#     Поднять его отдельному городу тоже больше нельзя: сборка одна на страну,
#     и z15 по всей России — это кратный рост времени и веса.
#   - min_feature_size_at_max_zoom не трогается: замер показал, что 99.7% байтов
#     воды на z14 — объекты крупнее 2 px, срезать по размеру там просто нечего.
#
# История: до 2026-09-02 здесь была секция `subjects` с per-subject
# simplify_tolerance у 34 субъектов (вода > 40% веса пака) — экономия, которую
# новая схема сборки выразить не может. По корпусу это +4.2% на тех паках;
# если понадобится вернуть, вариант ровно один — поднять simplify_tolerance
# глобально в `defaults`, оценив, как полпикселя смотрятся на сухопутных
# субъектах. Сами значения и обоснования — в git history этого файла.
