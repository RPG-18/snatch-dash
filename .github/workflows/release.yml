name: Release build

# Стабильный релиз: собирает и публикует APK в GitHub Releases (не prerelease,
# в отличие от nightly.yml) по пушу тега вида v1.2.3. Версия релиза берётся
# из самого тега (build-name), а не из pubspec.yaml — pubspec's version:
# остаётся только дефолтом для локальных/dev-сборок, бампать его вручную
# перед релизом не обязательно.
#
# in-app update-checker (lib/util/github_release.dart, GET /releases/latest)
# ожидает ровно это: единственный не-prerelease релиз с тегом vX.Y.Z и .apk
# ассетом, версия установленного APK (PackageInfo.version) совпадает с
# частью тега после "v".
#
# Требует секретов репозитория — см. nightly.yml.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write # публикация релиза

env:
  FLUTTER_VERSION: '3.44.6' # см. комментарий в nightly.yml — держать синхронно

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21' # см. комментарий в nightly.yml — почему именно 21

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Write API key secrets
        env:
          YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
          MAPTILER_API_KEY: ${{ secrets.MAPTILER_API_KEY }}
        run: |
          echo "YANDEX_API_KEY=${YANDEX_API_KEY}" > android/dart_defines.local.properties
          echo "MAPTILER_API_KEY=${MAPTILER_API_KEY}" > android/maptiler.local.properties

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define-from-file=android/dart_defines.local.properties \
            --build-name=${{ steps.version.outputs.version }} \
            --build-number=${{ github.run_number }}

      - name: Rename APK
        id: apk
        run: |
          NAME="snatch-dash-${{ steps.version.outputs.version }}.apk"
          mv build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: 'v${{ steps.version.outputs.version }}'
          prerelease: false
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/${{ steps.apk.outputs.name }}
