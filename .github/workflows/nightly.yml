name: Nightly build

# Ночная сборка Android APK из main. Запускается по расписанию (UTC!) и
# вручную. Требует секретов репозитория:
#   YANDEX_API_KEY   — см. android/dart_defines.defaults.properties
#   MAPTILER_API_KEY — см. android/maptiler.defaults.properties
# Без них сборка всё равно пройдёт (обе properties-заготовки принимают
# пустое значение по умолчанию), но карта в приложении будет пустой.

on:
  schedule:
    # 01:00 UTC == 04:00 MSK. Пропускается автоматически, если в main не
    # было новых коммитов с прошлого успешного nightly (см. шаг "Check for
    # new commits").
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Собрать, даже если новых коммитов нет'
        type: boolean
        default: false

permissions:
  contents: write # нужно, чтобы публиковать nightly-релиз и двигать тег

concurrency:
  group: nightly-build
  cancel-in-progress: true

env:
  # Must ship a Dart SDK satisfying pubspec.yaml's `sdk: ^3.12.2` — Flutter
  # 3.44.0 bundles Dart 3.12.0 and fails `flutter pub get` on this constraint;
  # 3.44.6 bundles 3.12.2 (matches local dev + .metadata's pinned revision).
  # Bump only alongside pubspec.yaml's sdk constraint, not independently.
  FLUTTER_VERSION: '3.44.6'

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      date: ${{ steps.vars.outputs.date }}
      short_sha: ${{ steps.vars.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # нужна полная история + теги для сравнения с nightly

      - name: Check for new commits since last nightly
        id: check
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LAST=$(git rev-list -n 1 nightly 2>/dev/null || echo "none")
          CURR=$(git rev-parse HEAD)
          if [ "$LAST" = "$CURR" ]; then
            echo "Нет новых коммитов с прошлого nightly ($CURR), пропускаю."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute build vars
        id: vars
        run: |
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # This is the JDK that *runs* javac, not the app's own bytecode
          # target (that's android/app/build.gradle.kts's sourceCompatibility/
          # targetCompatibility = VERSION_17, unrelated and unaffected by this).
          # yandex_maps_mapkit's prebuilt .aar ships class files compiled by
          # Java 21 (class file version 65) — a JDK 17 javac can't even read
          # those off the classpath ("bad class file ... wrong version 65.0,
          # should be 61.0"), regardless of target. Must stay >= whatever JDK
          # that dependency was built with; 21 matches Android Studio's
          # bundled JBR, which is what local builds use (`flutter config`'s
          # JDK auto-detection finds it first, ahead of JAVA_HOME).
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Write API key secrets
        env:
          YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
          MAPTILER_API_KEY: ${{ secrets.MAPTILER_API_KEY }}
        run: |
          echo "YANDEX_API_KEY=${YANDEX_API_KEY}" > android/dart_defines.local.properties
          echo "MAPTILER_API_KEY=${MAPTILER_API_KEY}" > android/maptiler.local.properties

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APKs
        run: |
          # --split-per-abi: one APK per ABI instead of a single ~160MB fat
          # APK bundling all three (yandex_maps_mapkit's native lib alone is
          # 30-40MB per ABI). x86_64 dropped — real phones don't use it, only
          # emulators do; --target-platform intentionally omits it.
          flutter build apk --release --split-per-abi \
            --target-platform android-arm,android-arm64 \
            --dart-define-from-file=android/dart_defines.local.properties \
            --build-number=${{ github.run_number }}

      - name: Rename APKs
        id: apk
        run: |
          BASENAME="snatch-dash-nightly-${{ needs.check.outputs.date }}-${{ needs.check.outputs.short_sha }}"
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi="$(basename "$f" | sed -E 's/^app-(.*)-release\.apk$/\1/')"
            mv "$f" "build/app/outputs/flutter-apk/${BASENAME}-${abi}.apk"
          done
          echo "basename=$BASENAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.basename }}
          path: build/app/outputs/flutter-apk/${{ steps.apk.outputs.basename }}-*.apk
          retention-days: 14

      - name: Publish nightly pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-${{ needs.check.outputs.date }}
          name: 'Nightly ${{ needs.check.outputs.date }} (${{ needs.check.outputs.short_sha }})'
          prerelease: true
          files: build/app/outputs/flutter-apk/${{ steps.apk.outputs.basename }}-*.apk

      - name: Move moving "nightly" tag
        run: |
          git tag -f nightly
          git push origin nightly --force
