# Template for android/dart_defines.local.properties (gitignored). Copy the
# value below there — this key is passed to the app via
# `--dart-define-from-file=android/dart_defines.local.properties`, not
# through Gradle, so it cannot live in android/local.properties: Flutter's
# dart-define-from-file parser rejects dotted keys like sdk.dir/flutter.sdk.
#
# Generate at https://developer.tech.yandex.ru/services/. One key now covers
# both the MapKit Mobile SDK (lib/main.dart, renders the map) and the
# Geosuggest API (lib/nav/suggest_api.dart, live "Куда" suggestions on the
# Route screen) — Yandex issues a single API key shared across its map
# products. Bring-your-own-key — without it the map stays blank and the
# Route screen's search returns no suggestions.
YANDEX_API_KEY=YOUR_YANDEX_API_KEY
