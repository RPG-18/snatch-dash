# Статический анализ Dart-половины проекта. Нативную половину проверяет Android
# Lint — см. CLAUDE.md, «Сборка и тесты»: эти два инструмента не пересекаются.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    # Все три включены при НУЛЕ находок на существующем коде (замер 09.09.2026),
    # то есть это не уборка, а храповик: неявный dynamic и сырые типы не заедут
    # молча при следующей правке.
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # ── Тоже с нулём находок на 09.09.2026: держим планку там, где она уже есть ──
    - cancel_subscriptions        # незакрытая подписка живёт столько же, сколько процесс
    - close_sinks
    - avoid_dynamic_calls
    - prefer_final_locals
    - always_declare_return_types
    - require_trailing_commas
    - throw_in_finally
    - literal_only_boolean_expressions

    # ── Включены вместе с починкой того, что нашли ──
    # 4 места: fire-and-forget вызовы в движок из обработчиков и петли навигации.
    # Теперь они помечены unawaited() — намерение видно, а забытый await заметен.
    - unawaited_futures
    # 1 место: пара File.exists() через Future.wait в app_logger.
    - avoid_slow_async_io
    - directives_ordering

    # ── Намеренно НЕ включено ──
    # discarded_futures: 51 находка, и почти все — обычный Flutter, async-вызов из
    #   обработчика события. Правило, тонущее в шуме, перестают читать целиком.
    # avoid_positional_boolean_parameters: 3 находки, вопрос вкуса, не корректности.
